name: Release Windows Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: Create as draft release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read version
        run: |
          $version = node -p "require('./package.json').version"
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build unpacked Windows app
        run: npm run build-win-portable

      - name: Archive portable zip
        run: |
          $outDir = Get-ChildItem -Path "./dist" -Directory | Where-Object { $_.Name -like "win-unpacked*" } | Select-Object -First 1
          if (-not $outDir) {
            Write-Error "win-unpacked output directory not found under dist/"
            exit 1
          }
          $zipName = "Home-Assistant-Desktop-v$env:VERSION-win-x64-portable.zip"
          $zipPath = "./dist/$zipName"
          Compress-Archive -Path "$($outDir.FullName)/*" -DestinationPath $zipPath
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ha-desktop-${{ env.VERSION }}-win-x64-portable
          path: ${{ env.ZIP_PATH }}
          retention-days: 90

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ghArgs = @(
            'release', 'create', $tag,
            '--title', "Home Assistant Desktop $env:VERSION (Windows portable)",
            '--notes', "Windows x64 portable build. Extract the zip and run Home Assistant Desktop.exe. Settings and cache live in the data folder next to the executable (not APPDATA). No installer, auto-start, or in-app update checks."
          )
          if ('${{ inputs.draft }}' -eq 'true') { $ghArgs += '--draft' }
          $ghArgs += $env:ZIP_PATH
          gh @ghArgs
